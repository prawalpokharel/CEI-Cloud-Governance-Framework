{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudoptimizer-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudoptimizer-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ required "apiKey is required. Create a cluster in the dashboard to get one, or set existingSecret to reference a Secret you manage yourself." .Values.apiKey | quote }}
{{- end }}
