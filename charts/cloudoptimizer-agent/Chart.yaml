# UPGRADING TO 0.2.0
#
# Adds PodDisruptionBudget and HorizontalPodAutoscaler collection,
# which needs two new ClusterRole rules. Upgrade with `helm upgrade`
# rather than by bumping the image tag alone: an agent running ahead
# of its ClusterRole logs a 403 per cycle and omits the resilience
# findings, which read as a clean cluster rather than as missing data.
