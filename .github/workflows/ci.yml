name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-engine:
    name: core-engine (pytest + migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudopt
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: cloudoptimizer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudopt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cloudopt:devpass@localhost:5432/cloudoptimizer
      # Separate database: the schema tests delete all tenants, and the
      # suite refuses to run against the application database.
      TEST_DATABASE_URL: postgres://cloudopt:devpass@localhost:5432/cloudoptimizer_test

    defaults:
      run:
        working-directory: core-engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core-engine/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify a clean install can import the app
        # requirements.txt once omitted PyJWT and argon2-cffi, which are
        # imported transitively from src.main. Every developer machine had
        # them from an earlier ad-hoc pip install, so nothing failed locally
        # while a fresh deploy would have crashed on startup. Installing into
        # a separate virtualenv is the only way to catch that.
        run: |
          python -m venv /tmp/cleanenv
          /tmp/cleanenv/bin/pip install --quiet -r requirements.txt
          DATABASE_URL=postgres://u:p@localhost:1/db \
            /tmp/cleanenv/bin/python -c "import sys; sys.path.insert(0,'.'); import src.main, src.cli"

      - name: Create the throwaway test database
        run: PGPASSWORD=devpass psql -h localhost -U cloudopt -d cloudoptimizer -c 'CREATE DATABASE cloudoptimizer_test'

      - name: Apply migrations
        run: alembic upgrade head

      - name: Apply migrations to the test database
        run: DATABASE_URL=$TEST_DATABASE_URL alembic upgrade head

      - name: Verify migrations are reversible
        # A migration that cannot be rolled back is a migration you cannot
        # safely deploy. Postgres does not drop ENUM types with their tables,
        # so this specifically catches the "type already exists" failure that
        # only appears on the second upgrade.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Verify models match the applied schema
        run: alembic check

      - name: Run tests
        run: pytest -q

      - name: Scale check
        # Catches limits that a small fixture cannot: payload size, analysis
        # latency, and the cost invariants under a realistically large graph.
        run: python -m tests.scale_test --workloads 500

      - name: Verify golden files are reproducible
        # The goldens pin the NIW / USPTO demonstration surface. Regenerating
        # must be a no-op; if it is not, the engine is nondeterministic and
        # the guard is worthless. PYTHONHASHSEED is varied because set
        # iteration order previously leaked into responses.
        run: |
          PYTHONHASHSEED=12345 python -m tests.regen_golden
          git diff --exit-code tests/golden/ || {
            echo "::error::Golden files changed when regenerated. The engine is"
            echo "::error::nondeterministic, or a code change moved the NIW numbers."
            exit 1
          }

  backend:
    name: backend (syntax)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Syntax check
        # There is no backend test suite yet. This at least prevents a file
        # that cannot be parsed from reaching a deploy.
        run: npm test

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  agent:
    name: agent (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  chart:
    name: helm chart (lint + template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/cloudoptimizer-agent --set apiKey=co_live_ci
      - name: Render templates
        # Catches a template that lints but produces invalid YAML, which lint
        # alone does not detect.
        run: helm template ci charts/cloudoptimizer-agent --set apiKey=co_live_ci > /dev/null
      - name: Assert the agent role grants no access to secrets
        # The "no secrets, no configmaps" promise is enforced by RBAC, so a
        # rule added by accident must fail the build rather than ship.
        run: |
          helm template ci charts/cloudoptimizer-agent --set apiKey=co_live_ci \
            | grep -A100 "kind: ClusterRole" > /tmp/role.yaml
          if grep -qE "^\s+- (secrets|configmaps)$" /tmp/role.yaml; then
            echo "::error::The agent ClusterRole grants access to secrets or configmaps."
            exit 1
          fi
          echo "ClusterRole grants neither secrets nor configmaps."
