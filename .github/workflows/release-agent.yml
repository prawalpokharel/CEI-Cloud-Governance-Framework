name: Release agent image

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 0.1.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: agent
          # Both architectures are required, not optional: Graviton and Ampere
          # node pools are common, and an amd64-only image fails to schedule
          # there with an error most operators read as a broken chart.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloudoptimizer-agent:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/cloudoptimizer-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify both architectures are present
        # A manifest that silently lost an architecture is worse than a failed
        # build: it works everywhere the maintainer tests and fails only on
        # the customer's ARM nodes.
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/cloudoptimizer-agent:${{ steps.meta.outputs.tag }}
          docker buildx imagetools inspect "$IMAGE" | tee /tmp/manifest.txt
          for arch in amd64 arm64; do
            grep -q "linux/$arch" /tmp/manifest.txt || {
              echo "::error::Manifest is missing linux/$arch"
              exit 1
            }
          done
