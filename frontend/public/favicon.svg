<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- CloudOptimizer mark: a dependency graph converging on one hub node --
       the thing the product finds. Deep blue field, accent-orange hub. -->
  <rect width="64" height="64" rx="14" fill="#1B4F72"/>
  <g stroke="#AED6F1" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="34" x2="14" y2="16"/>
    <line x1="32" y1="34" x2="50" y2="16"/>
    <line x1="32" y1="34" x2="12" y2="44"/>
    <line x1="32" y1="34" x2="52" y2="44"/>
  </g>
  <circle cx="14" cy="16" r="5" fill="#AED6F1"/>
  <circle cx="50" cy="16" r="5" fill="#AED6F1"/>
  <circle cx="12" cy="44" r="5" fill="#AED6F1"/>
  <circle cx="52" cy="44" r="5" fill="#AED6F1"/>
  <circle cx="32" cy="34" r="9" fill="#F39C12"/>
</svg>
