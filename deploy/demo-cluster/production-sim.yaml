---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shop
  labels: {app: api-gateway, team: shop, app.kubernetes.io/managed-by: Helm}
spec:
  replicas: 1
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh","-c","mkdir -p /w && echo ok > /w/index.html && ( while true; do if nc -z -w 2 catalog 8080 && nc -z -w 2 checkout 8080; then echo ok > /w/healthz; else rm -f /w/healthz; fi; sleep 5; done ) & exec httpd -f -p 8080 -h /w"]
          env:
            - {name: CATALOG_URL, value: "http://catalog:8080"}
            - {name: CHECKOUT_URL, value: "http://checkout:8080"}
            - {name: PAYMENTS_URL, value: "http://payments:8080"}
            - {name: SEARCH_URL, value: "http://search:8080"}
          envFrom: [{configMapRef: {name: shop-config}}]
          # httpGet, NOT exec: the kubelet probes over HTTP directly. Exec
          # probes at this pod density go through the container runtime and
