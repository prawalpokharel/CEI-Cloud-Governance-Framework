# A production-shaped demo estate for CloudOptimizer.
#
# Apply with:  ./deploy.sh demo-cluster
#
# Twelve services across two namespaces with REAL runtime dependencies:
# each dependent runs a healthz loop that checks upstream reachability and
# a cheap httpGet readiness probe reads the result -- so failures genuinely
# cascade (kill orders-db and catalog/checkout/payments go unready), while
# the kubelet never pays for exec probes, which time out at this pod
# density on a shared local VM (observed live: 33 consecutive timeouts of
# the literal `true` command).
#
# The estate carries a real estate's flaws ON PURPOSE, so every analysis
# panel has something true to say:
#
#   orders-db     hub: 5 dependents, stateful, NO PodDisruptionBudget
#   legacy-ledger :latest image, no ownership labels, 2 dependents
#   session-cache minAvailable == replicas PDB -- blocks every node drain
#   email-worker  6 idle replicas -- waste that safe-to-delete clears
#   api-gateway   single replica, user-facing -- the SPOF prescriptions fix
#   checkout      CPU-only HPA under an upstream dependency
#   shop-config   ConfigMap mounted by 5 services -- fan-in

---
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels: {env: production-sim}
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels: {env: production-sim}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: shop
data:
  LOG_LEVEL: "info"
  FEATURE_FLAGS: "checkout_v2,fast_search"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-db
  namespace: shop
  labels: {app: orders-db, team: storage, app.kubernetes.io/managed-by: Helm}
spec:
  serviceName: orders-db
  replicas: 2
  selector: {matchLabels: {app: orders-db}}
  template:
    metadata: {labels: {app: orders-db}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh","-c","mkdir -p /w && echo ok > /w/index.html && echo ok > /w/healthz; exec httpd -f -p 8080 -h /w"]
          # httpGet, NOT exec: the kubelet probes over HTTP directly. Exec
          # probes at this pod density go through the container runtime and
          # time out under load even for `true` -- observed live, 33
          # consecutive timeouts of the literal true command. The dependency
          # cascade is preserved by the healthz loop above: the file exists
          # only while upstreams answer, and httpd 404s when it is gone.
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-cache
  namespace: shop
  labels: {app: session-cache, team: storage, app.kubernetes.io/managed-by: Helm}
spec:
  replicas: 2
  selector: {matchLabels: {app: session-cache}}
  template:
    metadata: {labels: {app: session-cache}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh","-c","mkdir -p /w && echo ok > /w/index.html && echo ok > /w/healthz; exec httpd -f -p 8080 -h /w"]
          # httpGet, NOT exec: the kubelet probes over HTTP directly. Exec
          # probes at this pod density go through the container runtime and
          # time out under load even for `true` -- observed live, 33
          # consecutive timeouts of the literal true command. The dependency
          # cascade is preserved by the healthz loop above: the file exists
          # only while upstreams answer, and httpd 404s when it is gone.
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-ledger
  namespace: platform
  labels: {app: legacy-ledger}
spec:
  replicas: 2
  selector: {matchLabels: {app: legacy-ledger}}
  template:
    metadata: {labels: {app: legacy-ledger}}
    spec:
      containers:
        - name: app
          image: busybox:latest
          command: ["sh","-c","mkdir -p /w && echo ok > /w/index.html && echo ok > /w/healthz; exec httpd -f -p 8080 -h /w"]
          # httpGet, NOT exec: the kubelet probes over HTTP directly. Exec
          # probes at this pod density go through the container runtime and
          # time out under load even for `true` -- observed live, 33
          # consecutive timeouts of the literal true command. The dependency
          # cascade is preserved by the healthz loop above: the file exists
