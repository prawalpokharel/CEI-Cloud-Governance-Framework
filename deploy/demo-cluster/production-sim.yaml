          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shop
  labels: {app: catalog, team: shop, app.kubernetes.io/managed-by: Helm}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh","-c","mkdir -p /w && echo ok > /w/index.html && ( while true; do if nc -z -w 2 orders-db 8080 && nc -z -w 2 session-cache 8080; then echo ok > /w/healthz; else rm -f /w/healthz; fi; sleep 5; done ) & exec httpd -f -p 8080 -h /w"]
          env:
            - {name: ORDERS_DB_URL, value: "http://orders-db:8080"}
            - {name: SESSION_CACHE_URL, value: "http://session-cache:8080"}
          envFrom: [{configMapRef: {name: shop-config}}]
          # httpGet, NOT exec: the kubelet probes over HTTP directly. Exec
          # probes at this pod density go through the container runtime and
          # time out under load even for `true` -- observed live, 33
          # consecutive timeouts of the literal true command. The dependency
          # cascade is preserved by the healthz loop above: the file exists
          # only while upstreams answer, and httpd 404s when it is gone.
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {requests: {cpu: 10m, memory: 16Mi}}
