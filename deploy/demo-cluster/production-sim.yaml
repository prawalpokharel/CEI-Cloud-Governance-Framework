          command: ["sh","-c","mkdir -p /w && echo ok > /w/index.html && ( while true; do if nc -z -w 2 catalog 8080; then echo ok > /w/healthz; else rm -f /w/healthz; fi; sleep 5; done ) & exec httpd -f -p 8080 -h /w"]
          env:
